name: Validate

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check oc.js
          Copy-Item host.jsx host-check.js
          node --check host-check.js
          Remove-Item host-check.js

      - name: Manifest XML and version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content CSXS/manifest.xml -Raw
          $version = $manifest.ExtensionManifest.ExtensionBundleVersion
          if (-not $version) { throw "ExtensionBundleVersion is missing" }
          Write-Host "manifest ok, version $version"

      - name: Package
        shell: pwsh
        run: ./build.ps1
